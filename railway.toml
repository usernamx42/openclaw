[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Entrypoint handles volume permissions then drops to node user.
startCommand = "docker-entrypoint.sh node /app/dist/index.js gateway --allow-unconfigured --bind lan --port 8080"
# No HTTP /health endpoint exists — Railway uses TCP healthcheck by default.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
